perspective_texturing = false
pgxp_cpu_mode = true
pgxp_tolerance = 1.0
# Dataflow only (psxrecomp ENHANCEMENTS.md G1.11): at hook-build coverage the
# position cache only hands unrelated fractions to CPU-built 2D HUD polygons.
pgxp_position_fallback = false
