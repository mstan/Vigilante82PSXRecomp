format_version = 5
id = "v82.enhancement.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "mstan"
description = "Native-wide battle rendering with Vigilante 8: 2nd Offense-specific terrain, sky, HUD and match detection hooks. Menus, briefings and FMVs keep their authored 4:3 layout."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-00868"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Enable Vigilante 8: 2nd Offense's native-wide battle view. The render target, terrain selection and sky grow with the view; the HUD anchors to the new screen edges."
group = "Display"
default_enabled = true

[[option]]
feature = "widescreen"
id = "aspect"
label = "View"
description = "Fit to Window follows live resizing from native 4:3 up to 32:9. Fixed ratios use the same custom renderer, not the retired 16:9 squash."
group = "Display"
type = "choice"
default = "Fit"

[[option.choice]]
value = "Fit"
label = "Fit to Window"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[option.choice]]
value = "32:9"
label = "32:9"

[[plugin]]
feature = "widescreen"
id = "v82.widescreen"

[[feature]]
id = "netplay-view"
name = "Enhanced multiplayer renderer"
description = "Use the enhanced battle renderer for fixed multiplayer views."
default_enabled = true
hidden = true

[[plugin]]
feature = "netplay-view"
id = "v82.netplay-view"
