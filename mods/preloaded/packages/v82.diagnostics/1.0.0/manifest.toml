format_version = 5
id = "v82.diagnostics"
version = "1.0.0"
name = "Playtest Diagnostics"
author = "mstan"
license = "GPL-3.0-only"
description = "Input recording and an optional input display for bug reports. Recording starts on and the display starts off."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00868"

[[feature]]
id = "recording"
name = "Input Recording"
description = "Writes inputs.csv, session settings and starting card copies beneath saves/diagnostics beside the game. Zip the newest session folder when reporting a bug. The disc and BIOS are never included."
group = "Diagnostics"
default_enabled = true

[[feature]]
id = "osd"
name = "Input Display"
description = "Shows the accepted P1/P2 buttons, a frame counter and REC/PLAY status in the corner. Turning this off does not stop recording."
group = "Diagnostics"
default_enabled = false

[[plugin]]
feature = "recording"
id = "v82.diagnostics"

[[plugin]]
feature = "osd"
id = "v82.diagnostics.osd"
