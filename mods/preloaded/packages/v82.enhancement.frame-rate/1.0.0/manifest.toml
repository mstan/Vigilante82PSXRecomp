format_version = 5
id = "v82.enhancement.frame-rate"
version = "1.0.0"
name = "Vigilante 8: 2nd Offense High Frame Rate"
author = "mstan"
description = "Redraws battles between the game's own frames with cars, projectiles and the camera placed part of the way to their next position. Game logic, timers and audio keep their stock cadence."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00868"

# Presentation only: the game simulates at its stock rate. Each extra frame is
# drawn by the game's own draw code inside a sandboxed render pass that is
# rolled back afterwards (psxrecomp docs/RENDER_PASSES.md), not a crossfade.
[[feature]]
id = "frame-rate"
name = "High Frame Rate"
description = "Draws true in-between frames during single-player and netplay battles at the selected rate. Menus, briefings and FMVs keep their authored timing. Requires the OpenGL renderer, which it selects."
group = "Display"
default_enabled = true

[[option]]
feature = "frame-rate"
id = "rate"
label = "Frame rate"
description = "Display refresh follows the monitor's measured refresh rate. A fixed rate presents that many frames per second."
group = "Display"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[option.choice]]
value = "360"
label = "360 FPS"

[[plugin]]
feature = "frame-rate"
id = "v82.frame-rate"
